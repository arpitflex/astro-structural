<!-- @dsCard group="Colors" viewport="700x170" name="Commit steps & now" subtitle="Five ink steps; green is reserved for the one current thing" -->
<!doctype html>
<html class="ag" lang="en">
<head>
<meta charset="utf-8">
<title>commit steps & now</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="ag-page" style="display: grid; grid-template-columns: repeat(5, 1fr) 1.6fr; gap: 12px">
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; border: 1px solid var(--line-row); background: var(--heat-0)"></div>
    <span class="ag-label">heat-0</span>
    <span class="ag-meta-text">no activity</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--heat-1)"></div>
    <span class="ag-label">heat-1</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--heat-2)"></div>
    <span class="ag-label">heat-2</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--heat-3)"></div>
    <span class="ag-label">heat-3</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--heat-4)"></div>
    <span class="ag-label">heat-4</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--now)"></div>
    <span class="ag-label">now</span>
    <span class="ag-meta-text">current state</span>
  </div>
</div>
</body>
</html>
