<!-- @dsCard group="Colors" viewport="700x230" name="Dark theme" subtitle="An inversion via data-theme=&quot;dark&quot;; no new hues" -->
<!doctype html>
<html class="ag" lang="en">
<head>
<meta charset="utf-8">
<title>dark theme</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="ag-page" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
  <div data-theme="light" style="padding: 16px 16px 20px; border: 1px solid var(--line-row); background: var(--bg); color: var(--fg-1)">
    <div style="display: flex; justify-content: space-between; border-top: var(--rule-section); padding-top: var(--gap-rule)">
      <span class="ag-label">light</span>
      <span class="ag-meta-text">14 aug 2026</span>
    </div>
    <div style="margin-top: 24px; font: var(--type-name); font-stretch: var(--wdth-name); font-size: 44px; line-height: 0.9">grid</div>
    <div style="display: flex; gap: 3px; margin-top: 16px">
      <span style="width: 14px; height: 14px; background: var(--heat-0)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-1)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-2)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-3)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-4)"></span>
      <span style="width: 14px; height: 14px; background: var(--now)"></span>
    </div>
  </div>
  <div data-theme="dark" style="padding: 16px 16px 20px; background: var(--bg); color: var(--fg-1)">
    <div style="display: flex; justify-content: space-between; border-top: var(--rule-section); padding-top: var(--gap-rule)">
      <span class="ag-label">dark</span>
      <span class="ag-meta-text">14 aug 2026</span>
    </div>
    <div style="margin-top: 24px; font: var(--type-name); font-stretch: var(--wdth-name); font-size: 44px; line-height: 0.9">grid</div>
    <div style="display: flex; gap: 3px; margin-top: 16px">
      <span style="width: 14px; height: 14px; background: var(--heat-0)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-1)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-2)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-3)"></span>
      <span style="width: 14px; height: 14px; background: var(--heat-4)"></span>
      <span style="width: 14px; height: 14px; background: var(--now)"></span>
    </div>
  </div>
</div>
</body>
</html>
