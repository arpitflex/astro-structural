<!doctype html>
<html class="ag" lang="en">
<head>
<meta charset="utf-8">
<title>marks & glyphs</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="ag-page" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center">
  <h1 class="ag-name" style="margin-top: 0; font-size: 48px; line-height: 0.9">grid<br>system</h1>
  <div style="display: grid; gap: 12px">
    <div style="display: flex; gap: 28px; font: var(--fw-mono) 22px/1 var(--font-mono); font-stretch: var(--wdth-mono)">
      <span>→</span><span>↗</span><span>←</span><span>·</span><span>—</span>
    </div>
    <span class="ag-meta-text">internal · external · back · separator · range</span>
    <div style="display: flex; gap: 10px; align-items: center">
      <span class="ag-now"></span>
      <span class="ag-label">now</span>
    </div>
  </div>
</div>
