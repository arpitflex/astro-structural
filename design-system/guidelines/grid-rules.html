<!-- @dsCard group="Grid" viewport="700x200" name="Lines" subtitle="The only ornament. No boxes, radii or shadows." -->
<!doctype html>
<html class="ag" lang="en">
<head>
<meta charset="utf-8">
<title>lines</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="ag-page" style="display: grid; gap: 22px">
  <div style="display: grid; grid-template-columns: 1fr 90px 200px; gap: 16px; align-items: center">
    <div style="border-top: var(--rule-section)"></div>
    <span class="ag-label">2px ink</span>
    <span class="ag-meta-text">opens a section</span>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 90px 200px; gap: 16px; align-items: center">
    <div style="border-top: var(--rule-item)"></div>
    <span class="ag-label">1px ink</span>
    <span class="ag-meta-text">opens an item (tile, facts, log)</span>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 90px 200px; gap: 16px; align-items: center">
    <div style="border-top: var(--rule-row)"></div>
    <span class="ag-label">1px 10%</span>
    <span class="ag-meta-text">separates rows</span>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 90px 200px; gap: 16px; align-items: center">
    <div style="border-top: 1px solid var(--line-grid)"></div>
    <span class="ag-label">1px 7%</span>
    <span class="ag-meta-text">the column grid</span>
  </div>
</div>
</body>
</html>
