<!-- @dsCard group="Colors" viewport="700x170" name="Paper & ink" subtitle="Two colors plus three greys for metadata" -->
<!doctype html>
<html class="ag" lang="en">
<head>
<meta charset="utf-8">
<title>paper & ink</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div class="ag-page" style="display: grid; grid-template-columns: 1.4fr 1.4fr 1fr 1fr 1fr; gap: 12px">
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; border: 1px solid var(--line-row); background: var(--bg)"></div>
    <span class="ag-label">bg</span>
    <span class="ag-meta-text">paper</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--fg-1)"></div>
    <span class="ag-label">fg-1</span>
    <span class="ag-meta-text">ink · text, rules</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--fg-2)"></div>
    <span class="ag-label">fg-2</span>
    <span class="ag-meta-text">lists</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--fg-3)"></div>
    <span class="ag-label">fg-3</span>
    <span class="ag-meta-text">meta</span>
  </div>
  <div style="display: grid; gap: 6px">
    <div style="height: 64px; background: var(--fg-4)"></div>
    <span class="ag-label">fg-4</span>
    <span class="ag-meta-text">captions</span>
  </div>
</div>
</body>
</html>
