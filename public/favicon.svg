<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Paper, the section rule, and the green square for "now". Inverts with the system theme. -->
  <style>
    .paper { fill: #f2f2ee; }
    .ink { fill: #131312; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #131312; }
      .ink { fill: #ecece7; }
    }
  </style>
  <rect class="paper" width="32" height="32" />
  <rect class="ink" width="32" height="3" />
  <rect x="4" y="20" width="8" height="8" fill="#20a04e" />
</svg>
